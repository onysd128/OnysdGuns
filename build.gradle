buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.

version = "1.2.1-1.12.2"
group = "com.mrcrayfish.guns" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "onysd-guns"

sourceCompatibility = targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2816"
    runDir = "run"
    
    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "snapshot_20180808"
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    useDepAts = true
}

repositories {
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
}

dependencies {
    compile 'obfuscate:Obfuscate:0.2.6:1.12.2'
    provided 'controllable:Controllable:1.12.2:0.3.0'
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    // the local vanilla texture pack stays on disk but must never be packed, it overrides textures
    exclude 'assets/minecraft/**'
}

// ForgeGradle 2.3 downloads the game assets from http://resources.download.minecraft.net, which only answers over
// https now, so its own task is turned off and this one fetches whatever is missing from the asset index instead
tasks.withType(net.minecraftforge.gradle.tasks.DownloadAssetsTask) {
    enabled = false
}

task downloadAssetsHttps {
    dependsOn 'getAssetIndex'
    doLast {
        def assets = new File(gradle.gradleUserHomeDir, 'caches/minecraft/assets')
        def index = new File(assets, 'indexes/1.12.json')
        def objects = new groovy.json.JsonSlurper().parse(index).objects
        def missing = objects.values().findAll { !new File(assets, 'objects/' + it.hash.substring(0, 2) + '/' + it.hash).exists() }
        if (missing.isEmpty()) return
        logger.lifecycle("Downloading ${missing.size()} missing game assets")
        def pool = java.util.concurrent.Executors.newFixedThreadPool(8)
        def failures = new java.util.concurrent.atomic.AtomicInteger()
        missing.each { obj ->
            pool.submit {
                def file = new File(assets, 'objects/' + obj.hash.substring(0, 2) + '/' + obj.hash)
                file.parentFile.mkdirs()
                def part = new File(file.path + '.part')
                try {
                    new URL('https://resources.download.minecraft.net/' + obj.hash.substring(0, 2) + '/' + obj.hash).withInputStream { input ->
                        part.withOutputStream { out -> out << input }
                    }
                    part.renameTo(file)
                } catch (Exception e) {
                    part.delete()
                    failures.incrementAndGet()
                }
            }
        }
        pool.shutdown()
        pool.awaitTermination(30, java.util.concurrent.TimeUnit.MINUTES)
        if (failures.get() > 0) throw new GradleException("${failures.get()} game assets could not be downloaded")
    }
}

tasks.getAssets.dependsOn downloadAssetsHttps
